# Alternativa al progetto incluso: `xcodegen generate` ricrea QuadernoAI.xcodeproj.
# Il progetto incluso è generato da tools/generate_xcodeproj.py (Xcode 16+).
name: QuadernoAI
options:
  bundleIdPrefix: it.quadernoai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
packages:
  QuadernoCore:
    path: Packages/QuadernoCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  QuadernoAI:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: QuadernoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.quadernoai.app
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
  QuadernoAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: QuadernoAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: it.quadernoai.app.tests
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  QuadernoAI:
    build:
      targets:
        QuadernoAI: all
    test:
      targets:
        - QuadernoAITests
        - package: QuadernoCore/QuadernoCoreTests
